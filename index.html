        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;

            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            color: #fff; padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px; padding: 30px; max-width: 600px; width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
        }
        h1 { text-align: center; margin-bottom: 10px; font-size: 1.6rem; letter-spacing: 1px; }
        .subtitle { text-align: center; opacity: 0.8; margin-bottom: 20px; font-size: 0.9rem; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            flex: 1; padding: 10px; border: none; border-radius: 10px;
            background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-weight: 600;
            transition: 0.3s;
        }
        .tab.active { background: #4a90e2; box-shadow: 0 4px 12px rgba(74,144,226,0.4); }
        .mode-block { display: none; }
        .mode-block.active { display: block; }

        label { display: block; margin-top: 15px; font-size: 0.9rem; opacity: 0.9; }

        select, input[type="text"] {
            width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px;
            border: none; background: rgba(255,255,255,0.15); color: #fff;
            font-size: 1rem; font-family: monospace; letter-spacing: 1px;
            outline: none; transition: 0.3s;
        }
        select:focus, input[type="text"]:focus { background: rgba(255,255,255,0.25); box-shadow: 0 0 0 2px #4a90e2; }
        select {
            appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 35px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2012%2012%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M2%204l4%204%204-4z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 10px center;
        }
        select option { background: #203a43; color: #fff; }

        button {
            width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #4a90e2, #357abd); color: white;
            font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(74,144,226,0.4); }
        button:active { transform: translateY(0); }

        .info-card {
            margin-top: 20px; padding: 20px; background: rgba(0,0,0,0.3);
            border-radius: 12px; display: none; word-break: break-word;
        }
        .info-card.show { display: block; }
        .record {
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding: 12px 0;
        }
        .record:last-child { border-bottom: none; }
        .record-title {
            font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px;
            color: #4a90e2;
        }
        .record-details {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px; font-size: 0.9rem;
        }
        .detail-item {
            background: rgba(255,255,255,0.1); padding: 8px; border-radius: 8px;
        }
        .detail-label {
            font-size: 0.75rem; opacity: 0.7; margin-bottom: 4px;
        }
        .detail-value {
            font-weight: 600; letter-spacing: 0.5px;
        }
        .comment {
            margin-top: 8px; font-style: italic; opacity: 0.85; font-size: 0.85rem;
        }
        .empty-message {
            text-align: center; opacity: 0.7; padding: 20px; display: none;
        }
        .info { margin-top: 15px; font-size: 0.8rem; opacity: 0.7; text-align: center; }
    </style>
</head>

            // Записи с пустым engine (в выпадающем списке не показываются, но могут появиться при поиске по powerclass)
            { engine: "", powerclass: "07", powerhp: "", model: "Jetta 6", year: "", comments: "" },
            { engine: "", powerclass: "88", powerhp: "", model: "Passat USA", year: "", comments: "" },
            { engine: "", powerclass: "9E", powerhp: "120", model: "Passat B6", year: "", comments: "2.0 TDI" }
        ];

        // Элементы управления
        const tabs = document.querySelectorAll('.tab');
        const modeBlocks = document.querySelectorAll('.mode-block');
        const engineSelect = document.getElementById('engineSelect');
        const engineInfoCard = document.getElementById('engineInfoCard');
        const engineEmpty = document.getElementById('engineEmpty');
        const powerclassInput = document.getElementById('powerclassInput');
        const searchBtn = document.getElementById('searchBtn');
        const powerclassInfoCard = document.getElementById('powerclassInfoCard');
        const powerclassEmpty = document.getElementById('powerclassEmpty');

        // Заполняем выпадающий список уникальными engine (исключаем пустые)
        const uniqueEngines = [...new Set(engines.filter(e => e.engine).map(e => e.engine))].sort();
        uniqueEngines.forEach(engine => {
            const option = document.createElement('option');
            option.value = engine;
            option.textContent = engine;
            engineSelect.appendChild(option);
        });

        // Переключение вкладок
        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                modeBlocks.forEach(block => block.classList.remove('active'));
                const targetId = this.getAttribute('data-target');
                const targetBlock = document.getElementById(targetId);
                if (targetBlock) {
                    targetBlock.classList.add('active');
                }
            });
        });

        // Функция отображения записей (общая)
        function renderRecords(records, container, emptyElement) {
            container.innerHTML = '';
            container.classList.remove('show');
            emptyElement.style.display = 'none';

            if (records.length === 0) {
                emptyElement.style.display = 'block';
                return;
            }

            records.forEach((record, index) => {
                const recordDiv = document.createElement('div');
                recordDiv.className = 'record';

                const title = document.createElement('div');
                title.className = 'record-title';
                const displayEngine = record.engine || 'Неизвестный двигатель';
                title.textContent = (records.length > 1 ? `Вариант ${index + 1}: ` : '') + displayEngine;
                recordDiv.appendChild(title);

                const details = document.createElement('div');
                details.className = 'record-details';

                const fields = [
                    { label: 'Powerclass', value: record.powerclass },
                    { label: 'Power hp', value: record.powerhp },
                    { label: 'Model', value: record.model || '—' },
                    { label: 'Year', value: record.year || '—' }
                ];

                fields.forEach(field => {
                    const detailItem = document.createElement('div');
                    detailItem.className = 'detail-item';
                    const label = document.createElement('div');
                    label.className = 'detail-label';
                    label.textContent = field.label;
                    const value = document.createElement('div');
                    value.className = 'detail-value';
                    value.textContent = field.value;
                    detailItem.appendChild(label);
                    detailItem.appendChild(value);
                    details.appendChild(detailItem);
                });

                recordDiv.appendChild(details);

                if (record.comments && record.comments.trim() !== '') {
                    const comment = document.createElement('div');
                    comment.className = 'comment';
                    comment.textContent = '💬 ' + record.comments;
                    recordDiv.appendChild(comment);
                }

                container.appendChild(recordDiv);
            });

            container.classList.add('show');
        }

        // Обработка выбора двигателя
        engineSelect.addEventListener('change', function() {
            const selectedEngine = this.value;
            if (!selectedEngine) {
                engineInfoCard.classList.remove('show');
                engineEmpty.style.display = 'none';
                return;
            }
            const records = engines.filter(e => e.engine === selectedEngine);
            renderRecords(records, engineInfoCard, engineEmpty);
        });

        // Обработка поиска по Powerclass
        function searchByPowerclass() {
            const query = powerclassInput.value.trim().toUpperCase();
            if (!query) {
                powerclassInfoCard.classList.remove('show');
                powerclassEmpty.style.display = 'none';
                return;
            }

            // Точное совпадение (без учета регистра)
            const records = engines.filter(e => e.powerclass.toUpperCase() === query);
            renderRecords(records, powerclassInfoCard, powerclassEmpty);
        }

        searchBtn.addEventListener('click', searchByPowerclass);
        powerclassInput.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                searchByPowerclass();
            }
        });

        // Очищаем результаты при изменении ввода
        powerclassInput.addEventListener('input', function() {
            if (!this.value.trim()) {
                powerclassInfoCard.classList.remove('show');
                powerclassEmpty.style.display = 'none';
            }
        });
    </script>
</body>
</html>
